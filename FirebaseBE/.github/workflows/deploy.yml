name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: |
        npm ci
        if [ -d "functions" ]; then
          cd functions && npm ci && cd ..
        fi

    - name: Verify Arabic Stories PWA
      run: |
        if [ -d "qasas-pwa" ]; then
          echo "Arabic Stories PWA files verified:"
          ls -la qasas-pwa/
        fi

    - name: Deploy Arabic Stories PWA
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARABICSTORIES_82611 }}'
        projectId: arabicstories-82611
        channelId: live
        target: qasas-stories
      env:
        FIREBASE_CLI_EXPERIMENTS: webframeworks

    - name: Comment PR Preview URLs
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const comment = [
            '## 🚀 Firebase Hosting Preview URLs\n',
            '### قصص الأنبياء (Arabic Stories)',
            '- **Preview URL**: https://qasas-un-nabiyeen--pr-${{ github.event.number }}.web.app',
            '- **Target**: `qasas-stories`\n',
            '### 📱 Features:',
            '- ✅ Progressive Web App (PWA)',
            '- ✅ Offline functionality',
            '- ✅ Mobile installation support',
            '- ✅ Arabic RTL layout',
            '- ✅ Interactive word translation',
            '- ✅ Diacritics toggle (harakat)\n',
            '*Preview URLs are available for 7 days after deployment.*',
          ].join('\n');

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
