name: Deploy Preview

on:
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened]

jobs:
  deploy_preview:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Deploy Arabic Stories Preview
      id: deploy_qasas
      uses: FirebaseExtended/action-hosting-deploy@v0
      with:
        repoToken: '${{ secrets.GITHUB_TOKEN }}'
        firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ARABICSTORIES_82611 }}'
        projectId: arabicstories-82611
        target: qasas-stories
      env:
        FIREBASE_CLI_EXPERIMENTS: webframeworks

    - name: Comment Preview URL
      uses: actions/github-script@v7
      with:
        script: |
          const qasasUrl = '${{ steps.deploy_qasas.outputs.details_url }}' || 'Not deployed';

          const comment = [
            '## 🔍 Preview Deployment\n',
            '### 📚 Arabic Stories (قصص الأنبياء)',
            `**Preview URL**: ${qasasUrl}\n`,
            '### 🧪 Test Checklist',
            '- [ ] PWA can be installed on mobile',
            '- [ ] Works offline after initial load',
            '- [ ] Arabic text displays correctly',
            '- [ ] Word translation clicks work',
            '- [ ] Diacritics toggle functions',
            '- [ ] Chapter navigation works',
            '- [ ] Responsive design on mobile/tablet',
            '- [ ] RTL layout displays properly\n',
            '*Preview will be automatically cleaned up when PR is closed.*',
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes('🔍 Preview Deployment'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: comment
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
          }
