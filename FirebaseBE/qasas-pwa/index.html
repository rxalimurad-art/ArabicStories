<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>قصص الأنبياء - Arabic Stories</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c5530">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header>
            <div class="header-content">
                <div class="nav-breadcrumb" id="nav-breadcrumb">
                    <span class="breadcrumb-item active">قصص الأنبياء</span>
                </div>
                <h1 id="main-title">قصص الأنبياء</h1>
                <p id="subtitle">Arabic Stories with Interactive Translation</p>
            </div>
        </header>

        <main>
            <section id="home" class="screen active">
                <div class="stories-list" id="stories-list">
                    <!-- Stories will be populated here -->
                </div>
            </section>

            <section id="story" class="screen">
                <div class="mobile-nav-bar">
                    <button id="back-btn" class="mobile-back-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="m15 18-6-6 6-6"/>
                        </svg>
                    </button>
                    <span class="nav-title" id="story-title-nav"></span>
                </div>

                <div id="chapters-list" class="chapters-list">
                    <!-- Chapters will be populated here -->
                </div>
            </section>

            <section id="chapter" class="screen">
                <div class="mobile-nav-bar">
                    <button id="back-to-story" class="mobile-back-btn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="m15 18-6-6 6-6"/>
                        </svg>
                    </button>
                    <span class="nav-title" id="chapter-title-nav"></span>
                </div>

                <div class="story-content">
                    <div id="arabic-text" class="arabic-text">
                        <!-- Arabic chapter content -->
                    </div>

                    <div id="word-tooltip" class="word-tooltip hidden">
                        <span id="word-meaning"></span>
                    </div>

                    <div class="chapter-actions">
                        <button id="mark-complete-btn" class="action-btn complete-btn">Mark Chapter as Complete</button>
                    </div>

                    <div id="full-translation" class="full-translation">
                        <h3>English Translation:</h3>
                        <p id="english-translation"></p>
                        <h3>اردو ترجمہ:</h3>
                        <p id="urdu-translation"></p>
                    </div>
                </div>
            </section>
        </main>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
        </div>

        <!-- Swipe hint indicator -->
        <div id="swipe-hint" class="swipe-hint hidden">
            <div class="swipe-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path d="m15 18-6-6 6-6"/>
                </svg>
            </div>
            <span>Swipe right to go back</span>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(error => console.log('SW registration failed'));
            });
        }
    </script>
</body>
</html>
