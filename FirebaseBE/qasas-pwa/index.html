<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قصص الأنبياء - Arabic Stories</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c5530">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header>
            <h1>قصص الأنبياء</h1>
            <p>Arabic Stories with Interactive Translation</p>
        </header>

        <main>
            <section id="home" class="screen active">
                <div class="stories-list" id="stories-list">
                    <!-- Stories will be populated here -->
                </div>
            </section>

            <section id="story" class="screen">
                <div class="story-header">
                    <button id="back-btn" class="back-btn">← Back</button>
                    <h2 id="story-title"></h2>
                </div>

                <div id="chapters-list" class="chapters-list">
                    <!-- Chapters will be populated here -->
                </div>
            </section>

            <section id="chapter" class="screen">
                <div class="story-header">
                    <button id="back-to-story" class="back-btn">← Back to Story</button>
                    <h2 id="chapter-title"></h2>
                </div>

                <div class="story-content">
                    <div id="arabic-text" class="arabic-text">
                        <!-- Arabic chapter content -->
                    </div>

                    <div id="word-translation" class="word-translation hidden">
                        <div class="translation-content">
                            <span id="selected-word"></span>
                            <span id="word-meaning"></span>
                        </div>
                    </div>

                    <div class="story-actions">
                        <button id="toggle-harakat" class="action-btn secondary">Toggle Arabic Diacritics</button>
                        <button id="show-translation" class="action-btn">Show Full Translation</button>
                        <button id="hide-translation" class="action-btn hidden">Hide Translation</button>
                    </div>

                    <div id="full-translation" class="full-translation hidden">
                        <h3>English Translation:</h3>
                        <p id="english-translation"></p>
                        <h3>اردو ترجمہ:</h3>
                        <p id="urdu-translation"></p>
                    </div>
                </div>
            </section>
        </main>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('SW registered'))
                    .catch(error => console.log('SW registration failed'));
            });
        }
    </script>
</body>
</html>
